name: Required checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: required-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generated-project:
    name: Generated Xcode project
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify committed project matches source membership
        run: |
          python3 ios/Scripts/generate_project.py
          git diff --exit-code -- ios/VisionOS.xcodeproj

  swift-packages:
    name: Swift package tests
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Record Swift toolchain
        run: swift --version
      - name: Test Guidance, Targets, Tasks, and HapticLink
        shell: bash
        run: |
          set -euo pipefail
          for package in Guidance Targets Tasks HapticLink; do
            swift test --package-path "ios/Packages/$package"
          done
